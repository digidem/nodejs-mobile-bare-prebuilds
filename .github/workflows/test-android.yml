name: Test on Android emulator

on:
  workflow_call:
    inputs:
      module_spec:
        type: string
        description: |
          '<module_name>@<version>' (e.g. 'sodium-native@5.1.0'). Output by
          prebuild.yml / prebuild-all.yml as `module_spec` — keeps the test
          pinned to the exact version that was built.
        required: true
      target:
        type: string
        description: |
          Prebuild target: 'android-x64' or 'android-arm64'. Determines the
          prebuilds/<target>/ directory the .node is installed into, the
          emulator architecture, and the default artifact_name. Defaults to
          'android-x64' — the only target that runs on the Ubuntu x86_64
          runner without nested virtualization.
        required: false
        default: "android-x64"
      artifact_name:
        type: string
        description: |
          Name of the prebuild artifact uploaded earlier in the run.
          If empty (the default), it's computed as `<module_name>-<module_version>-<target>`,
          matching the name `prebuild.yml` / `prebuild-all.yml` upload with.
        required: false
        default: ""
      test_runner:
        type: string
        description: |
          One of 'smoke' (default), 'module', or 'custom'.
          - 'smoke':  auto-generated test that just require()s the module.
          - 'module': runs the module's own test/*.js via brittle.
          - 'custom': uses the file pointed to by `test_script`.
        required: false
        default: "smoke"
      test_script:
        type: string
        description: |
          Path to a caller-provided test script (relative to the caller repo
          root). Only used when test_runner is 'custom'.
        required: false
        default: ""
      test_exclude:
        type: string
        description: |
          Newline-separated list of test file basenames to skip when
          test_runner is 'module' (e.g. tests that can't run in the
          emulator sandbox).
        required: false
        default: ""
      nodejs_mobile_version:
        type: string
        description: "nodejs-mobile release tag to download libnode from"
        required: false
        default: "v18.20.4"
      api_level:
        type: number
        description: "Android API level for the emulator"
        required: false
        default: 30
      floor_api_level:
        type: number
        description: |
          Oldest Android API level the prebuild must load on. Runs the same
          test on a second, older emulator. Default matches the
          ANDROID_PLATFORM the prebuild action targets, which is nodejs-mobile's
          real device-support floor. Set equal to `api_level` to skip the
          second run.

          This is the lower *bound*, not a sample: the point is that whatever
          breaks only on the oldest supported device gets caught. RELR packed
          relocations (emitted when ANDROID_PLATFORM >= 28, SIGSEGV on
          Android < 9) are the one such break found so far and would also be
          caught at 27 — but that is hindsight about one bug, not a reason to
          raise the floor. Don't raise it because the emulator at this level is
          awkward; fix the emulator.
        required: false
        default: 24
      harness_ref:
        type: string
        description: |
          Optional override for the harness checkout ref. Defaults to the
          ref this reusable workflow itself is running from
          (`job.workflow_sha`), so the harness always matches the workflow
          version.
        required: false
        default: ""
      git_repo_slug:
        type: string
        description: |
          'owner/repo' for the module's upstream GitHub repo. Output by
          prebuild-all.yml. Used with `git_ref` to check out the module's
          `test/` folder for `test_runner: module` (the npm tarball
          typically omits tests).
        required: false
        default: ""
      git_ref:
        type: string
        description: |
          Git ref (commit SHA or tag name) to check out the upstream repo
          at. Output by prebuild-all.yml. Accepted by `actions/checkout`'s
          `ref:` input. Only used when `test_runner` is 'module'.
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    # A healthy run is ~3-4 minutes end to end (SDK setup, gradle build,
    # emulator boot, test). 15 gives generous headroom while making a wedged
    # emulator fail in minutes rather than three quarters of an hour.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Test on both the requested API level and the floor API level
        # (deduped when they're equal).
        api-level: ${{ fromJSON(inputs.api_level == inputs.floor_api_level && format('[{0}]', inputs.api_level) || format('[{0},{1}]', inputs.floor_api_level, inputs.api_level)) }}
    name: test (API ${{ matrix.api-level }})
    steps:
      - name: Map target to emulator arch and image
        id: inputs
        env:
          TARGET: ${{ inputs.target }}
          API_LEVEL: ${{ matrix.api-level }}
        shell: bash
        run: |
          set -eu
          case "$TARGET" in
            android-x64)   echo "emulator_arch=x86_64"    >> "$GITHUB_OUTPUT" ;;
            android-arm64) echo "emulator_arch=arm64-v8a" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unsupported target '$TARGET' for Android tests (must be android-x64 or android-arm64)."
              exit 1
              ;;
          esac
          # ATD (automated test device) images are built for exactly this — headless,
          # fast, reliable — but only exist for API 30+. Below that, `google_apis`
          # rather than `default`: the `default` API 24 image hung during cold boot
          # on roughly two runs in three (adb polls `sys.boot_completed` a few times,
          # then silence until the job timeout), and `google_apis` is the more
          # maintained family for these old levels.
          if [ "$API_LEVEL" -ge 30 ]; then
            echo "emulator_target=google_atd" >> "$GITHUB_OUTPUT"
            echo "emulator_ram=4096M" >> "$GITHUB_OUTPUT"
          else
            echo "emulator_target=google_apis" >> "$GITHUB_OUTPUT"
            # 4 GB on these old images is a plausible boot-hang contributor and
            # they need nothing like it.
            echo "emulator_ram=2048M" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout test harness
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.harness_ref || job.workflow_sha }}
          path: .nodejs-mobile-bare-prebuilds
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache nodejs-mobile android binaries
        id: cache-libnode
        uses: actions/cache@v5
        with:
          path: .nodejs-mobile-bare-prebuilds/test-harness/android/app/libnode
          key: libnode-android-${{ inputs.nodejs_mobile_version }}

      - name: Download nodejs-mobile android libraries
        if: steps.cache-libnode.outputs.cache-hit != 'true'
        env:
          NM_VERSION: ${{ inputs.nodejs_mobile_version }}
        run: |
          set -euo pipefail
          harness=.nodejs-mobile-bare-prebuilds/test-harness/android
          tmp=$(mktemp -d)
          url="$(.nodejs-mobile-bare-prebuilds/scripts/nodejs-mobile-url.sh "$NM_VERSION" android)"
          echo "Downloading $url"
          curl -fL "$url" -o "$tmp/libnode.zip"
          unzip -q "$tmp/libnode.zip" -d "$tmp/libnode"
          mkdir -p "$harness/app/libnode"
          # Zip layout: include/node/*.h, bin/<abi>/libnode.so
          cp -R "$tmp/libnode/include" "$harness/app/libnode/"
          cp -R "$tmp/libnode/bin"     "$harness/app/libnode/"

      - name: Assemble nodejs-project
        uses: ./.nodejs-mobile-bare-prebuilds/.github/actions/assemble-test-project
        with:
          module_spec: ${{ inputs.module_spec }}
          target: ${{ inputs.target }}
          artifact_name: ${{ inputs.artifact_name }}
          test_runner: ${{ inputs.test_runner }}
          test_script: ${{ inputs.test_script }}
          test_exclude: ${{ inputs.test_exclude }}
          git_repo_slug: ${{ inputs.git_repo_slug }}
          git_ref: ${{ inputs.git_ref }}
          nodejs_project_dir: .nodejs-mobile-bare-prebuilds/test-harness/android/app/src/main/assets/nodejs-project

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: .nodejs-mobile-bare-prebuilds/test-harness/android
        env:
          ABI: ${{ steps.inputs.outputs.emulator_arch }}
        run: gradle -PabiFilter=${ABI} :app:assembleDebug --no-daemon

      # No AVD cache and no snapshot: emulator snapshots are not reliable on
      # GitHub-hosted runners. The API 24 image saved `default_boot` in 1.5s,
      # reloaded it in 0.8s, then never reported `sys.boot_completed` again —
      # 42 minutes of silence until the job timeout. API 30 failed the run
      # after restoring a cached snapshot too. Cold boot costs ~10s and always
      # works, and the cache existed only to carry the snapshot.
      - name: Run test on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ steps.inputs.outputs.emulator_target }}
          arch: ${{ steps.inputs.outputs.emulator_arch }}
          force-avd-creation: false
          ram-size: ${{ steps.inputs.outputs.emulator_ram }}
          # A healthy boot reports `sys.boot_completed` within ~10s. Failing at
          # 5 minutes turns a wedged emulator into a clear step failure instead
          # of a job that sits there until the timeout cancels it — and lets the
          # post steps run.
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          # android-emulator-runner runs each LINE of `script:` as a separate
          # `sh -c` invocation, so variable state and `set` flags don't
          # persist across lines. Delegate to a committed bash script.
          script: bash $GITHUB_WORKSPACE/.nodejs-mobile-bare-prebuilds/test-harness/android/run-test.sh
