name: Generate prebuild

on:
  workflow_dispatch:
    inputs:
      module_name:
        type: string
        description: "The name of the module to prebuild"
        required: true
      platform:
        type: choice
        description: "The platform to prebuild for"
        required: true
        options:
          - "android"
          - "ios"
        default: "android"
      arch:
        type: choice
        description: "The architecture to prebuild for"
        required: true
        options:
          - "arm64"
          - "x64"
          - "arm"
        default: "arm64"
      simulator:
        type: boolean
        description: "Build for an iOS simulator (ios only)"
        required: false
        default: false
      module_version:
        type: string
        description: "Exact version or dist-tag (e.g. '5.1.0' or 'latest'). Resolved by `npm pack`."
        required: false
        default: "latest"
      patches_dir:
        type: string
        description: |
          Directory in the caller repo holding `<module>+<version>.patch`
          files (patch-package convention). A patch matching the resolved
          module_version is applied before build.
        required: false
        default: "patches"
      nodejs_mobile_version:
        type: string
        description: "digidem/nodejs-mobile release to link against, without the leading v"
        required: false
        default: "24.19.0-0"
  workflow_call:
    inputs:
      module_name:
        type: string
        description: "The name of the module to prebuild"
        required: true
      platform:
        type: string
        description: "The platform to prebuild for"
        required: true
        default: "android"
      arch:
        type: string
        description: "The architecture to prebuild for"
        required: true
        default: "arm64"
      simulator:
        type: boolean
        description: "Build for an iOS simulator (ios only)"
        required: false
        default: false
      module_version:
        type: string
        description: "Exact version or dist-tag (e.g. '5.1.0' or 'latest'). Resolved by `npm pack`."
        required: false
        default: "latest"
      patches_dir:
        type: string
        description: |
          Directory in the caller repo holding `<module>+<version>.patch`
          files (patch-package convention). A patch matching the resolved
          module_version is applied before build.
        required: false
        default: "patches"
      nodejs_mobile_version:
        type: string
        description: "digidem/nodejs-mobile release to link against, without the leading v"
        required: false
        default: "24.19.0-0"
    outputs:
      module_version:
        description: "The resolved version of the module"
        value: ${{ jobs.build.outputs.module_version }}
      module_spec:
        description: "Combined '<module_name>@<version>'. Pass directly to test-*.yml / release.yml."
        value: ${{ inputs.module_name }}@${{ jobs.build.outputs.module_version }}

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    name: ${{ inputs.module_name }} (${{ inputs.platform }}-${{ inputs.arch }}${{ inputs.simulator && '-simulator' || '' }})
    outputs:
      module_version: ${{ steps.prebuild.outputs.module_version }}
    steps:
      # Caller's repo — needed so `patches_dir` (a caller-relative path)
      # resolves against the workspace root. `persist-credentials: false`
      # keeps the caller's GITHUB_TOKEN out of $GITHUB_WORKSPACE/.git/config
      # so the untrusted `npm install` of the target module (with lifecycle
      # scripts) below can't read a (release-write-capable) token off disk.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Check out this repo at the SAME ref this reusable workflow is
      # running from (`job.workflow_sha` resolves the caller's @v2/@main/
      # branch ref), so the composite action below always matches the
      # workflow version — no @main pin that can drift from tagged
      # callers, and branch dispatches test in-flight action changes.
      - name: Checkout prebuild harness
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nodejs-mobile-bare-prebuilds
          persist-credentials: false

      - uses: ./.nodejs-mobile-bare-prebuilds/.github/actions/prebuild
        id: prebuild
        with:
          module_name: ${{ inputs.module_name }}
          platform: ${{ inputs.platform }}
          arch: ${{ inputs.arch }}
          simulator: ${{ inputs.simulator }}
          module_version: ${{ inputs.module_version }}
          patches_dir: ${{ inputs.patches_dir }}
          nodejs_mobile_version: ${{ inputs.nodejs_mobile_version }}
